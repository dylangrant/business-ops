# Allocation rules for ph27 shared bills. Source of truth: the 2025 ledger given to the
# accountant (owner confirmed 2026-09-30). Shares are fractions of the gross bill.
home_office:
  business_sqft: 100
  home_sqft: 2000          # 100 / 2000 = 5%

# paid_from: fill in per vendor (owner action). vault: where the portal login lives.
vendors:
  - {key: rent,           match: [rent, bilt],                  category: Rent,                       share: "0.05", vault: utilities-expenses, paid_from: "BECU via Bilt"}
  - {key: pacific_power,  match: [pacific power],               category: Utilities,                  share: "0.05", vault: utilities-expenses}
  - {key: nw_natural,     match: [nw natural],                  category: Utilities,                  share: "0.05", vault: utilities-expenses}
  - {key: portland_water, match: [portland water],              category: Utilities,                  share: "0.05", vault: utilities-expenses}
  - {key: internet,       match: [quantum fiber, centurylink, century link], category: Utilities,      share: "0.50", vault: utilities-expenses, note_label: internet}
  - {key: insurance,      match: [insurance],                   category: Insurance (non-health),     share: "0.05", vault: utilities-expenses}
  - {key: t_mobile,       match: [t-mobile],                    category: Telephone,                  share: "0.25", vault: utilities-expenses}
  - {key: onepassword,    match: [1password],                   category: Dues and Subscriptions,     share: "0.50", vault: ph27}
  - {key: claude,         match: [claude, anthropic],           category: Dues and Subscriptions,     share: "1.00", vault: ph27}
  - {key: namecheap,      match: [namecheap],                   category: Dues and Subscriptions,     share: "1.00", vault: ph27}
  - {key: shopify,        match: [shopify],                     category: Dues and Subscriptions,     share: "1.00", vault: ph27}
  - {key: zenbusiness,    match: [zenbusiness],                 category: Legal and Professional,     share: "1.00", vault: ph27}

# Mixed orders (plan 002): the share applies to the business-item subtotal, by item category.
mixed_vendors:
  - {key: amazon,    match: [amazon]}
  - {key: instacart, match: [instacart]}
mixed_categories:
  janitorial: {category: Janitorial, share: "0.05"}
  office:     {category: Office,     share: "1.00"}
