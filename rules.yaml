# Allocation rules for ph27 shared bills. Source of truth: the 2025 ledger given to the
# accountant (owner confirmed 2026-09-30). Shares are fractions of the gross bill.
home_office:
  business_sqft: 100
  home_sqft: 2000          # 100 / 2000 = 5%

# portal: false = owner does not vault this login; bill comes from the email body only (no portal fetch).
# owner_paid: false = paid by ph27 directly (Bluevine); nothing is owed to the owner.
# paid_from per owner 2026-09-30: everything BECU except Quantum Fiber (USAA, shared with Ivy); Bilt is a credit card, rent still from BECU. Subscriptions: fill in when known. vault: where the portal login lives.
vendors:
  - {key: rent,           match: [rent, bilt],                  category: Rent,                       share: "0.05", vault: utilities-expenses, paid_from: "BECU"}
  - {key: pacific_power,  match: [pacific power],               category: Utilities,                  share: "0.05", vault: utilities-expenses, paid_from: "BECU"}
  - {key: nw_natural,     match: [nw natural],                  category: Utilities,                  share: "0.05", vault: utilities-expenses, paid_from: "BECU"}
  - {key: portland_water, match: [portland water],              category: Utilities,                  share: "0.05", vault: utilities-expenses, paid_from: "BECU"}
  - {key: internet,       match: [quantum fiber, centurylink, century link], category: Utilities,      share: "0.50", vault: utilities-expenses, note_label: internet, paid_from: "USAA (shared with Ivy)"}
  - {key: insurance,      match: [insurance, usaa],                   category: Insurance (non-health),     share: "0.05", portal: false, paid_from: "BECU"}
  - {key: t_mobile,       match: [t-mobile],                    category: Telephone,                  share: "0.25", vault: utilities-expenses, paid_from: "BECU"}
  - {key: onepassword,    match: [1password],                   category: Dues and Subscriptions,     share: "0.50", portal: false}
  - {key: claude,         match: [claude, anthropic],           category: Dues and Subscriptions,     share: "1.00", portal: false, owner_paid: false, paid_from: "Bluevine"}
  - {key: namecheap,      match: [namecheap],                   category: Dues and Subscriptions,     share: "1.00", vault: ph27-ops}
  - {key: shopify,        match: [shopify],                     category: Dues and Subscriptions,     share: "1.00", vault: ph27-ops}
  - {key: zenbusiness,    match: [zenbusiness],                 category: Legal and Professional,     share: "1.00", vault: ph27-ops}

# Mixed orders (plan 002): the share applies to the business-item subtotal, by item category.
mixed_vendors:
  - {key: amazon,    match: [amazon]}
  - {key: instacart, match: [instacart]}
mixed_categories:
  janitorial: {category: Janitorial, share: "0.05"}
  office:     {category: Office,     share: "1.00"}
